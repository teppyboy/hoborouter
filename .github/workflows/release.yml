name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # sqlite-to-pg test runs `git show 3af6325:...`,
          # which needs full history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build web app
        run: cd apps/web && bun run build
      - name: Start Postgres
        run: |
          docker run -d --name hbr-ci-pg -e POSTGRES_PASSWORD=postgres \
            -p 55432:5432 postgres:17-alpine -c max_connections=400
          # pg_isready probes the unix socket and can succeed against the
          # init-phase temporary server (v0.4.0 CI failure); the script
          # probes TCP instead. See scripts/wait-postgres.sh.
          # Consecutive successful probes guard against accept-then-close
          # flapping right after init (run 37590822468 died on a mid-suite
          # "Connection closed" ~38s in). See scripts/wait-postgres.sh.
          bash scripts/wait-postgres.sh hbr-ci-pg
      # v0.3.0 CI: 5 files died at exactly 5000ms (bun's default per-test
      # timeout) on their first test, which provisions a throwaway Postgres DB
      # (CREATE DATABASE + migrate) plus scrypt sign-up. The 2-vCPU runner with
      # 4-way parallel workers and a Dockerized Postgres is ~8.5x slower than
      # local, so the 5s budget is too tight; 20s gives headroom without
      # masking real hangs (whole suite is ~110s here).
      - name: Run tests
        id: tests
        # continue-on-error keeps the job alive so the marker-gated retry step
        # below can evaluate the failure; the job's final status is decided by
        # the retry step (explicit fail when both attempts fail, success when
        # the retry recovers). build needs this job, so a real failure still
        # blocks the release.
        continue-on-error: true
        # Cosmetic UI/copy tests (tests/ci-cosmetic-ui.txt) are excluded from
        # this gate and run by the non-blocking "ui" job below.
        run: |
          set -o pipefail
          PORT=3998 bun run test:gate --timeout 20000 2>&1 | tee ci-test.log
        env:
          HBR_TEST_DATABASE_URL: >-
            postgres://postgres:postgres@127.0.0.1:55432/postgres
      # Run 37590822468: single transient "PostgresError: Connection closed"
      # during a Better Auth session query, no assertion failures, suite passes
      # locally with the exact command. Retry once, but only when the captured
      # log shows that transient marker: any other failure (assertion, timeout,
      # crash) exits here unchanged, and deterministic failures reproduce on
      # the retry run anyway, so fail-fast for real regressions is preserved.
      # continue-on-error above means failure() is false here; the outcome is
      # still 'failure' on the initial attempt, so gate on that instead.
      - name: Retry tests only on transient Postgres connection loss
        if: steps.tests.outcome == 'failure'
        run: |
          if ! grep -q 'PostgresError: Connection closed' ci-test.log; then
            echo "No transient 'Connection closed' error in log; failing as-is."
            exit 1
          fi
          echo 'Transient PostgresError: Connection closed detected;'
          echo 'retrying once.'
          sleep 5
          set -o pipefail
          if ! PORT=3998 bun test --parallel=4 \
            --timeout 20000 2>&1 | tee ci-retry.log; then
            echo 'Retry also failed; both attempts failed.'
            exit 1
          fi
        env:
          HBR_TEST_DATABASE_URL: >-
            postgres://postgres:postgres@127.0.0.1:55432/postgres

  # Cosmetic UI/copy tests from tests/ci-cosmetic-ui.txt. These are pure
  # render/i18n/layout checks (no DB), kept out of the release gate for
  # speed but still run on every release. Non-blocking by design.
  ui:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run cosmetic UI/copy tests
        run: bun run test:ui --timeout 20000

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tag names and the nearest-tag fallback for workflow_dispatch runs
          # need tags; a default depth-1 checkout has none.
          fetch-depth: 0
      - name: Resolve build metadata
        id: meta
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            # workflow_dispatch on a branch: never present the branch name
            # (e.g. "main") as a semver version; use the nearest valid tag
            # instead, or leave empty so the About page shows its explicit
            # "—" fallback (resolveBuildMetadata rejects non-release names).
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # github.sha is the exact commit built for both tag pushes and
          # workflow_dispatch, so image metadata and bundle revision agree.
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/teppyboy/hoborouter:${{ github.ref_name }}
            ghcr.io/teppyboy/hoborouter:latest
          build-args: |
            HBR_APP_VERSION=${{ steps.meta.outputs.version }}
            HBR_GIT_SHA=${{ steps.meta.outputs.sha }}
