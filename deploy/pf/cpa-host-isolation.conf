# PF anchor: block ALL host outbound traffic to the CPA container IP.
# Load target for the install steps in deploy/pf/README.md and
# docs/ops/runbook-foundation.md. Read-only template — this repository's
# scripts and tests NEVER load, enable, or modify PF; installation is an
# explicit, user-run approval gate.
#
# IPv4 only: CPA has the fixed IPv4 192.168.231.3 on the dedicated
# 192.168.231.0/24 cpa-net (internal: true, no published ports). IPv6 is
# DISABLED/absent for this stack; an IPv6 deny rule MUST be added BEFORE any
# IPv6 address is ever assigned to cpa-net (see runbook).

# Exact rule the preflight script requires (byte-for-byte):
block drop out log quick to 192.168.231.3

# Rationale: OrbStack `internal: true` does NOT block host→container traffic
# (empirically HTTP 200 from host to the old bridge IP). This rule is the
# compensating host firewall control for ALL ports/protocols to the CPA IP.

# Known bypass risks (documented, not solved here):
# - OrbStack runs containers in a Linux VM (vmenet/bridge100/utun paths);
#   if a future OrbStack version routes via a path PF does not filter, this
#   rule silently stops protecting — the preflight live host probe catches
#   this at start time by requiring the host probe to FAIL.
# - If IPv6 is ever enabled for cpa-net without an IPv6 deny, the host can
#   bypass this rule. Keep IPv6 disabled for CPA.
