services:
  cpa:
    image: eceasy/cli-proxy-api:v8.0.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8317:8317"
      # Callback ports published by upstream v8.0.4 docker-compose.yml.
      - "127.0.0.1:8085:8085"
      - "127.0.0.1:1455:1455"
      - "127.0.0.1:54545:54545"
      - "127.0.0.1:51121:51121"
      - "127.0.0.1:11451:11451"
    volumes:
      - ./cpa/config.yaml:/CLIProxyAPI/config.yaml
      - ./cpa/auths:/root/.cli-proxy-api

  hoborouter:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - cpa
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./.env
    environment:
      CPA_BASE_URL: http://cpa:8317
      HBR_GATEWAY_ENABLED: ${HBR_GATEWAY_ENABLED:-1}
    volumes:
      - hoborouter-data:/data

volumes:
  hoborouter-data:
